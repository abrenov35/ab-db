<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AB DB — Recherche Dropbox</title>
  <link rel="stylesheet" href="style.css?v=20260901-1">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>AB DB</h1>
        <p>Passerelle de recherche vers Dropbox</p>
      </div>
      <div class="toolbar-actions">
        <button id="opportunitiesBtn" class="secondary" type="button">📋 Opportunités</button>
        <button id="refreshBtn" class="secondary" type="button">Actualiser l’index</button>
      </div>
    </header>

    <div id="dropboxView">
      <section class="search-card">
        <label for="searchInput">Rechercher un dossier Dropbox</label>
        <div class="search-row">
          <input id="searchInput" type="search" autocomplete="off" placeholder="Nom du client, chantier, dossier…">
          <button id="searchBtn" type="button">Rechercher</button>
        </div>
        <p id="status" class="status">Saisis au moins 2 caractères.</p>
      </section>

      <section>
        <div id="results" class="results"></div>
      </section>
    </div>

    <section id="opportunitiesView" class="opportunities-view" hidden>
      <iframe
        id="opportunitiesFrame"
        title="AB Opportunités"
        src="https://abrenov35.github.io/ab-opp/"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </section>
  </main>

  <script src="config.js?v=20260901-1"></script>
  <script src="app.js?v=20260901-1"></script>
</body>
</html>
