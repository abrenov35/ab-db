<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AB DB — Recherche Dropbox</title>
  <link rel="stylesheet" href="style.css?v=20260905-1">
  <style>
    :root{--ab-blue:#0b4f8d;--ab-blue-2:#2f4f9f;--ab-yellow:#f2b400}
    body{margin:0}.app-shell{max-width:none!important;margin:0!important;padding:0!important}
    .topbar{display:flex!important;flex-wrap:nowrap!important;align-items:center!important;justify-content:flex-start!important;position:relative!important;gap:10px!important;height:58px!important;min-height:58px!important;max-height:58px!important;padding:7px 14px!important;box-sizing:border-box!important;overflow-x:auto!important;overflow-y:hidden!important;background:var(--ab-blue)!important;color:#fff!important;border-radius:0!important;box-shadow:0 2px 8px rgba(0,0,0,.18)!important}
    .topbar>div:first-child{display:flex!important;align-items:center!important;gap:7px!important;flex:0 0 auto!important}.topbar h1{margin:0!important;color:#fff!important;font-size:22px!important;line-height:1!important;font-weight:800!important}.topbar p{margin:0!important;color:#fff!important;font-size:10px!important;font-weight:700!important;letter-spacing:.7px!important;text-transform:uppercase!important;opacity:.95!important}
    .toolbar-actions{position:static!important;left:auto!important;transform:none!important;display:flex!important;flex-wrap:nowrap!important;align-items:center!important;justify-content:center!important;gap:8px!important;margin:0 auto!important;white-space:nowrap!important;flex:0 0 auto!important}.top-search{display:flex!important;align-items:center!important;flex:0 0 auto!important}.top-search input{width:300px!important;min-width:220px!important;height:38px!important;padding:0 12px!important;border:0!important;border-radius:7px!important;background:#fff!important;color:#1b2430!important;outline:none!important}.top-search input:focus{box-shadow:0 0 0 2px rgba(242,180,0,.55)!important}.toolbar-actions button{white-space:nowrap!important;flex:0 0 auto!important;height:38px!important;min-height:38px!important;max-height:38px!important;padding:9px 14px!important;border:1px solid rgba(255,255,255,.35)!important;border-radius:7px!important;background:var(--ab-blue-2)!important;color:#fff!important;font-weight:700!important;box-shadow:none!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important}.toolbar-actions button:hover{background:#3b61b0!important}#opportunitiesBtn{border-bottom:3px solid var(--ab-yellow)!important}
    .client-toolbar-buttons{display:flex!important;flex:0 0 auto!important;align-items:center!important;gap:8px!important}.client-toolbar-buttons>button.client-folder-btn.active{background:#3b61b0!important;border-bottom:3px solid var(--ab-yellow)!important}
    #dropboxView,.opportunities-view,.clients-view{max-width:1200px;margin:0 auto;padding:24px 18px}.search-status{min-height:20px;margin:0 0 12px;color:#667085;font-size:13px}.opportunities-status{font-size:13px;color:#667085;margin-bottom:10px}.opportunity-result .result-path{display:none}.clients-results{margin-top:0}
    .abopp-view{height:calc(100vh - 58px);background:#fff}.abopp-view iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    @media(max-width:720px){.topbar{white-space:nowrap!important}.topbar h1{font-size:19px!important}.topbar p{font-size:9px!important}.toolbar-actions{margin-left:0!important;margin-right:0!important}.top-search input{width:180px!important;min-width:180px!important}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header id="topbar" class="topbar">
      <div><h1>AB DB</h1><p>AB RENOV 35</p></div>
      <div class="toolbar-actions">
        <div class="top-search"><input id="searchInput" type="search" autocomplete="off" placeholder="Rechercher un dossier..."></div>
        <div class="client-toolbar-buttons">
          <button class="client-folder-btn" data-folder="PARTICULIERS" type="button">📁 · PARTICULIERS</button>
          <button class="client-folder-btn" data-folder="PROFESSIONNELS" type="button">📁 · PROFESSIONNELS</button>
          <button class="client-folder-btn" data-folder="AUTRES" type="button">📁 · AUTRES</button>
        </div>
        <button id="opportunitiesBtn" class="secondary" type="button">📁 Opportunités à traiter</button>
        <button id="abOppBtn" type="button">+ Opportunité</button>
      </div>
    </header>
    <div id="dropboxView">
      <p id="status" class="search-status"></p>
      <section><div id="results" class="results"></div></section>
    </div>
    <section id="clientsView" class="clients-view" hidden>
      <div id="clientsStatus" class="search-status"></div>
      <div id="clientsResults" class="results clients-results"></div>
    </section>
    <section id="opportunitiesView" class="opportunities-view" hidden>
      <div id="opportunitiesStatus" class="opportunities-status"></div>
      <div id="opportunitiesList" class="results"></div>
    </section>
    <section id="abOppView" class="abopp-view" hidden>
      <iframe id="abOppFrame" title="AB Opportunités"></iframe>
    </section>
  </main>
  <script src="config.js?v=20260901-4"></script>
  <script src="app.js?v=20260905-11"></script>
</body>
</html>
