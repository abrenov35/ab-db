<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AB DB — Recherche Dropbox</title>
  <link rel="stylesheet" href="style.css?v=20260901-4">
  <style>
    :root{
      --ab-blue:#0b4f8d;
      --ab-blue-2:#2f4f9f;
      --ab-yellow:#f2b400;
    }
    body{margin:0}
    .app-shell{max-width:none!important;margin:0!important;padding:0!important}
    .topbar{
      display:flex!important;
      align-items:center!important;
      gap:10px!important;
      min-height:58px!important;
      padding:7px 14px!important;
      background:var(--ab-blue)!important;
      color:#fff!important;
      border-radius:0!important;
      box-shadow:0 2px 8px rgba(0,0,0,.18)!important;
    }
    .topbar>div:first-child{
      display:flex!important;
      align-items:center!important;
      gap:7px!important;
      flex:0 0 auto!important;
    }
    .topbar h1{
      margin:0!important;
      color:#fff!important;
      font-size:22px!important;
      line-height:1!important;
      font-weight:800!important;
    }
    .topbar p{
      margin:0!important;
      color:#fff!important;
      font-size:10px!important;
      font-weight:700!important;
      letter-spacing:.7px!important;
      text-transform:uppercase!important;
      opacity:.95!important;
    }
    .toolbar-actions{
      margin-left:auto!important;
      display:flex!important;
      align-items:center!important;
      gap:8px!important;
    }
    .top-search{
      display:flex!important;
      align-items:center!important;
      gap:6px!important;
    }
    .top-search input{
      width:260px!important;
      min-width:220px!important;
      height:38px!important;
      padding:0 12px!important;
      border:0!important;
      border-radius:7px!important;
      background:#fff!important;
      color:#1b2430!important;
      outline:none!important;
      box-shadow:none!important;
    }
    .top-search input:focus{
      box-shadow:0 0 0 2px rgba(242,180,0,.55)!important;
    }
    .top-search button{
      white-space:nowrap!important;
      flex:none!important;
      min-height:38px!important;
      padding:9px 13px!important;
      border:1px solid rgba(255,255,255,.35)!important;
      border-radius:7px!important;
      background:var(--ab-blue-2)!important;
      color:#fff!important;
      font-weight:700!important;
      cursor:pointer!important;
    }
    .search-card-compact{
      padding-top:0!important;
      margin-top:0!important;
    }
    .toolbar-actions button{
      white-space:nowrap!important;
      flex:none!important;
      min-height:38px!important;
      padding:9px 14px!important;
      border:1px solid rgba(255,255,255,.35)!important;
      border-radius:7px!important;
      background:var(--ab-blue-2)!important;
      color:#fff!important;
      font-weight:700!important;
      box-shadow:none!important;
    }
    .toolbar-actions button:hover{
      background:#3b61b0!important;
    }
    #opportunitiesBtn{
      border-bottom:3px solid var(--ab-yellow)!important;
    }
    #dropboxView,
    .opportunities-view{
      max-width:1200px;
      margin:0 auto;
      padding:24px 18px;
    }
    @media(max-width:720px){
      .topbar{overflow-x:auto!important;white-space:nowrap}
      .topbar h1{font-size:19px!important}
      .topbar p{font-size:9px!important}
      .toolbar-actions{flex:none!important}
      .top-search input{width:180px!important;min-width:180px!important}
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>AB DB</h1>
        <p>AB RENOV 35</p>
      </div>
      <div class="toolbar-actions">
        <div class="top-search">
          <input id="searchInput" type="search" autocomplete="off" placeholder="Rechercher un dossier...">
          <button id="searchBtn" type="button">Rechercher</button>
        </div>
        <button id="opportunitiesBtn" class="secondary" type="button">📋 Opportunités à traiter</button>
        <button id="refreshBtn" class="secondary" type="button">Actualiser l’index</button>
      </div>
    </header>

    <div id="dropboxView">
      <section class="search-card search-card-compact">
        <p id="status" class="status">Saisis au moins 2 caractères.</p>
      </section>

      <section>
        <div id="results" class="results"></div>
      </section>
    </div>

    <section id="opportunitiesView" class="opportunities-view" hidden>
      <iframe id="opportunitiesFrame" title="AB Opportunités" loading="eager"></iframe>
    </section>
  </main>

  <script src="config.js?v=20260901-4"></script>
  <script src="app.js?v=20260901-4"></script>
</body>
</html>
